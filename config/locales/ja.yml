ja:
  activerecord:
    models:
      post: 投稿
      user: ユーザー
    attributes:
      post:
        title: タイトル
        facility_name: 施設名
        address: 住所
        play_style: 種別
        score: スコアまたは打数
        body: 感想
        image: 施設写真
      user:
        name: ユーザー名
        email_address: メールアドレス
        password: パスワード
        introduction: 自己紹介
    errors:
      messages:
        blank: "を入力してください"
        too_short: "は%{count}文字以上で入力してください"
        too_long: "は%{count}文字以内で入力してください"
        invalid: "は不正な値です"
        taken: "はすでに使用されています"

  errors:
    format: "%{attribute}%{message}"

  enums:
    post:
      play_style:
        driving_range: "打ちっぱなし"
        half_round: "ハーフラウンド"
        full_round: "１ラウンド"